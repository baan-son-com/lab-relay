<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hardware Simulator: Arduino Uno R3 + OLED + Relay Modules + 12VAC & 12VDC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', 'Inter', sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
      margin: 0;
      overflow-x: hidden;
    }
    .code-font {
      font-family: 'JetBrains Mono', monospace;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    .pin-node {
      cursor: crosshair;
      transition: transform 0.12s ease;
    }
    .pin-node:hover .pin-hit {
      stroke: #facc15;
      stroke-width: 3;
      fill-opacity: 0.45;
    }
    .pin-selected .pin-hit {
      stroke: #38bdf8;
      stroke-width: 3.5;
      fill: rgba(56, 189, 248, 0.35);
      animation: pulseRing 1.2s infinite;
    }
    @keyframes pulseRing {
      0% { r: 7; opacity: 1; }
      70% { r: 13; opacity: 0.3; }
      100% { r: 7; opacity: 1; }
    }

    .wire-path {
      cursor: pointer;
      transition: stroke-width 0.15s ease, filter 0.15s ease;
    }
    .wire-path:hover {
      stroke-width: 6 !important;
      filter: drop-shadow(0 0 6px rgba(250, 204, 21, 0.9));
    }

    .waypoint-handle {
      cursor: move;
      transition: r 0.12s ease, fill 0.12s ease;
    }
    .waypoint-handle:hover {
      r: 6;
      fill: #facc15;
    }

    @keyframes powerFlow {
      to {
        stroke-dashoffset: -24;
      }
    }
    .wire-energized-ac {
      stroke-dasharray: 6 6;
      animation: powerFlow 0.5s linear infinite;
    }
    .wire-energized-dc {
      stroke-dasharray: 10 4;
      animation: powerFlow 0.35s linear infinite;
    }

    @keyframes fanSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .fan-spinning {
      transform-box: fill-box;
      transform-origin: center;
      animation: fanSpin 0.4s linear infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Navigation / Toolbar -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex flex-wrap items-center justify-between gap-2.5 shadow-lg z-10">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-teal-600 flex items-center justify-center shadow-inner border border-teal-400/40">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <div>
        <h1 class="text-sm sm:text-base font-bold text-white leading-tight">
          Arduino Uno R3 + OLED + Relay 1Ch / 2Ch / 4Ch / Shield + 12VAC &amp; 12VDC
        </h1>
      </div>
    </div>

    <!-- Toolbar Actions -->
    <div class="flex flex-wrap items-center gap-2">
      <div class="flex items-center bg-slate-800 px-2.5 py-1.5 rounded-lg border border-slate-700 gap-1.5" title="เลือกสีสายไฟ">
        <span class="text-xs text-slate-300 mr-0.5 font-medium">สีสาย:</span>
        <button data-color="#ef4444" class="color-btn w-4 h-4 rounded-full bg-red-500 ring-2 ring-white scale-110 transition" title="สีแดง"></button>
        <button data-color="#1e293b" class="color-btn w-4 h-4 rounded-full bg-slate-800 border border-slate-400 transition" title="สีดำ"></button>
        <button data-color="#eab308" class="color-btn w-4 h-4 rounded-full bg-yellow-500 transition" title="สีเหลือง"></button>
        <button data-color="#3b82f6" class="color-btn w-4 h-4 rounded-full bg-blue-500 transition" title="สีน้ำเงิน"></button>
        <button data-color="#92400e" class="color-btn w-4 h-4 rounded-full bg-amber-800 transition" title="สีน้ำตาล"></button>
        <button data-color="#22c55e" class="color-btn w-4 h-4 rounded-full bg-green-500 transition" title="สีเขียว"></button>
        <button data-color="#a855f7" class="color-btn w-4 h-4 rounded-full bg-purple-500 transition" title="สีม่วง"></button>
      </div>

      <button id="btnAutoWireAll" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white text-xs font-bold rounded-lg shadow transition flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
        Auto-Wire All
      </button>

      <button id="btnClearWires" class="px-3 py-1.5 bg-slate-700 hover:bg-rose-600 text-slate-200 hover:text-white text-xs font-semibold rounded-lg transition flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        ล้างสายไฟ
      </button>
    </div>
  </header>

  <!-- Main Workspace Split Layout -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-0 overflow-hidden">

    <!-- LEFT/CENTER: Clean Hardware-Only Circuit Workbench -->
    <section class="lg:col-span-8 bg-[#0b1120] relative flex flex-col justify-between border-b lg:border-b-0 lg:border-r border-slate-800">

      <!-- Top Compact Status Badges -->
      <div class="px-3 py-2 flex flex-wrap items-center justify-between gap-1.5 bg-slate-900/90 border-b border-slate-800 text-[11px]">
        <div class="flex flex-wrap items-center gap-1.5">
          <span id="badge-ac" class="px-2.5 py-0.5 rounded-full font-bold bg-rose-500/20 text-rose-300 border border-rose-500/40">
            12VAC: OFF
          </span>
          <span id="badge-dc" class="px-2.5 py-0.5 rounded-full font-bold bg-rose-500/20 text-rose-300 border border-rose-500/40">
            12VDC: OFF
          </span>
          <span id="badge-5v-bus" class="px-2.5 py-0.5 rounded-full font-semibold bg-sky-500/20 text-sky-300 border border-sky-500/40">
            5V: 0.000A
          </span>
          <span id="badge-ac-loads" class="px-2.5 py-0.5 rounded-full font-semibold bg-slate-800 text-slate-300 border border-slate-700">
            AC Load: 0.00A
          </span>
          <span id="badge-dc-loads" class="px-2.5 py-0.5 rounded-full font-semibold bg-slate-800 text-slate-300 border border-slate-700">
            DC Load: 0.00A
          </span>
        </div>
        <div class="text-slate-400">
          สายไฟ: <span id="wireCount" class="text-white font-bold">0</span> เส้น
        </div>
      </div>

      <!-- SVG Canvas Container (Pure Hardware Workbench - Dark PCB Grid) -->
      <div class="flex-1 flex items-center justify-center p-2.5 overflow-auto bg-[#070d19]">
        <div class="w-full max-w-[1540px] rounded-xl overflow-hidden shadow-2xl border border-slate-800 bg-[#0d1526]">
          <svg id="circuitCanvas" viewBox="0 0 1540 940" class="w-full h-auto block select-none">
            <defs>
              <pattern id="minorGrid" width="20" height="20" patternUnits="userSpaceOnUse">
                <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#162238" stroke-width="0.8" />
              </pattern>
              <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
                <rect width="100" height="100" fill="url(#minorGrid)" />
                <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1e2d4a" stroke-width="1.3" />
              </pattern>

              <linearGradient id="copperGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#f59e0b" />
                <stop offset="50%" stop-color="#b45309" />
                <stop offset="100%" stop-color="#78350f" />
              </linearGradient>
              <linearGradient id="steelCoreGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#94a3b8" />
                <stop offset="50%" stop-color="#cbd5e1" />
                <stop offset="100%" stop-color="#64748b" />
              </linearGradient>
              <radialGradient id="bulbGlassGrad" cx="40%" cy="35%" r="60%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
                <stop offset="55%" stop-color="#e2e8f0" stop-opacity="0.45" />
                <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.65" />
              </radialGradient>
              <radialGradient id="bulbLightGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95" />
                <stop offset="40%" stop-color="#facc15" stop-opacity="0.6" />
                <stop offset="75%" stop-color="#f97316" stop-opacity="0.22" />
                <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
              </radialGradient>
              <radialGradient id="ledDcGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#86efac" stop-opacity="0.95" />
                <stop offset="45%" stop-color="#22c55e" stop-opacity="0.55" />
                <stop offset="100%" stop-color="#16a34a" stop-opacity="0" />
              </radialGradient>
              <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
                <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#020617" flood-opacity="0.55" />
              </filter>
            </defs>

            <!-- Clean Dark PCB Grid Background -->
            <rect width="1540" height="940" fill="url(#majorGrid)" />

            <!-- =========================================================================
                 1. OLED 0.96" I2C DISPLAY
                 ========================================================================= -->
            <g id="oled-display" transform="translate(36, 36)" filter="url(#dropShadow)">
              <rect x="0" y="0" width="220" height="122" rx="8" fill="#1d4ed8" stroke="#3b82f6" stroke-width="2" />
              <!-- Mounting Holes -->
              <circle cx="11" cy="11" r="4" fill="#0d1526" stroke="#93c5fd" stroke-width="1.2" />
              <circle cx="209" cy="11" r="4" fill="#0d1526" stroke="#93c5fd" stroke-width="1.2" />
              <circle cx="11" cy="111" r="4" fill="#0d1526" stroke="#93c5fd" stroke-width="1.2" />
              <circle cx="209" cy="111" r="4" fill="#0d1526" stroke="#93c5fd" stroke-width="1.2" />

              <rect x="20" y="12" width="180" height="74" rx="4" fill="#060911" stroke="#334155" stroke-width="2" />
              <text id="oled-line-1" x="28" y="31" font-size="10" font-weight="bold" fill="#38bdf8" class="code-font">OLED 0.96" I2C</text>
              <text id="oled-line-2" x="28" y="49" font-size="9.5" fill="#e2e8f0" class="code-font">AC: OFF | DC: OFF</text>
              <text id="oled-line-3" x="28" y="67" font-size="9" fill="#94a3b8" class="code-font">READY</text>

              <rect x="35" y="92" width="150" height="22" rx="3" fill="#0f172a" />
              <text x="55" y="90" font-size="7.5" font-weight="bold" fill="#fca5a5" text-anchor="middle">VCC</text>
              <text x="90" y="90" font-size="7.5" font-weight="bold" fill="#cbd5e1" text-anchor="middle">GND</text>
              <text x="125" y="90" font-size="7.5" font-weight="bold" fill="#fde047" text-anchor="middle">SCL</text>
              <text x="160" y="90" font-size="7.5" font-weight="bold" fill="#86efac" text-anchor="middle">SDA</text>
            </g>

            <!-- =========================================================================
                 2. ARDUINO UNO R3
                 ========================================================================= -->
            <g id="arduino-uno-r3" transform="translate(32, 224)" filter="url(#dropShadow)">
              <path
                d="M 15 0 H 325 L 345 20 V 224 L 325 244 H 15 A 15 15 0 0 1 0 229 V 15 A 15 15 0 0 1 15 0 Z"
                fill="#00878F"
                stroke="#0ea5e9"
                stroke-opacity="0.45"
                stroke-width="2.5"
              />
              <path d="M 60 44 H 310 V 200 H 60 Z" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" rx="4" />

              <!-- USB & Barrel Jack -->
              <rect x="-14" y="28" width="56" height="54" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="2" />
              <text x="14" y="58" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">USB</text>

              <rect x="-14" y="136" width="62" height="52" rx="5" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
              <text x="17" y="165" font-size="8" font-weight="bold" fill="#cbd5e1" text-anchor="middle">7-12V</text>

              <!-- ATMEGA328P -->
              <g id="atmega-chip">
                <rect x="130" y="106" width="128" height="36" rx="3" fill="#1e293b" stroke="#475569" stroke-width="2" />
                <text x="194" y="128" font-size="10.5" font-weight="bold" fill="#e2e8f0" text-anchor="middle">ATMEGA328P-PU</text>
              </g>

              <!-- Reset Button -->
              <g id="arduinoResetBtn" class="cursor-pointer" title="Reset">
                <rect x="64" y="110" width="22" height="22" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
                <circle cx="75" cy="121" r="7" fill="#dc2626" />
              </g>

              <circle id="uno-led-on" cx="116" cy="84" r="4.5" fill="#22c55e" stroke="#14532d" stroke-width="1" />
              <text x="116" y="75" font-size="7.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ON</text>

              <circle id="uno-led-l" cx="275" cy="68" r="4.5" fill="#713f12" stroke="#422006" stroke-width="1" />
              <text x="275" y="59" font-size="7.5" font-weight="bold" fill="#ffffff" text-anchor="middle">L</text>

              <text x="195" y="84" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">ARDUINO UNO R3</text>
              <text x="195" y="164" font-size="8.5" font-weight="bold" fill="#a7f3d0" text-anchor="middle">5V LOGIC • 40mA / PIN</text>

              <!-- Pin Headers -->
              <rect x="82" y="14" width="224" height="20" rx="2" fill="#0f172a" />
              <rect x="120" y="210" width="56" height="20" rx="2" fill="#0f172a" />
              <rect x="196" y="210" width="98" height="20" rx="2" fill="#0f172a" />
            </g>

            <!-- =========================================================================
                 3. 5V / GND POWER DISTRIBUTION RAIL
                 ========================================================================= -->
            <g id="power-rail-5v" transform="translate(32, 540)" filter="url(#dropShadow)">
              <rect x="0" y="0" width="344" height="106" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
              <text x="172" y="18" font-size="9.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">5V DC &amp; GND POWER RAIL</text>

              <!-- +5V Red Bus -->
              <rect x="14" y="28" width="316" height="30" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
              <text x="26" y="47" font-size="9.5" font-weight="bold" fill="#f87171">+5V</text>

              <!-- GND Blue Bus -->
              <rect x="14" y="66" width="316" height="30" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
              <text x="26" y="85" font-size="9.5" font-weight="bold" fill="#60a5fa">GND</text>
            </g>

            <!-- =========================================================================
                 4. RELAY #1: 1-Channel 5V Isolation Active HIGH (250V/10A)
                 ========================================================================= -->
            <g id="relay-mod-1" transform="translate(416, 36)" filter="url(#dropShadow)">
              <rect x="0" y="0" width="456" height="162" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2.2" />
              <rect x="0" y="0" width="456" height="24" rx="8" fill="#0369a1" />
              <rect x="0" y="14" width="456" height="10" fill="#0369a1" />
              <text x="228" y="16" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
                Relay 1-Ch 5V Isolation • 250V/10A (Active HIGH)
              </text>

              <!-- Control Pins -->
              <rect x="12" y="38" width="24" height="86" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
              <text x="42" y="54" font-size="9" font-weight="bold" fill="#f87171">VCC</text>
              <text x="42" y="80" font-size="9" font-weight="bold" fill="#94a3b8">GND</text>
              <text x="42" y="106" font-size="9" font-weight="bold" fill="#facc15">IN1</text>

              <!-- Optocoupler & LEDs -->
              <rect x="106" y="42" width="30" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
              <text x="121" y="57" font-size="6.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">ISO817</text>
              <circle id="r1-led-pwr" cx="112" cy="88" r="4.5" fill="#450a0a" />
              <text x="112" y="101" font-size="7" fill="#fca5a5" text-anchor="middle">PWR</text>
              <circle id="r1-led-act" cx="134" cy="88" r="4.5" fill="#052e16" />
              <text x="134" y="101" font-size="7" fill="#86efac" text-anchor="middle">ACT</text>

              <!-- Blue Relay Box -->
              <g transform="translate(164, 36)">
                <rect x="0" y="0" width="186" height="104" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
                <text x="93" y="17" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">SRD-05VDC-SL-C (1-CH)</text>
                <text x="93" y="30" font-size="7.5" font-weight="bold" fill="#fef08a" text-anchor="middle">5V / 70mA • 250VAC 10A</text>

                <rect x="16" y="42" width="154" height="48" rx="3" fill="#0369a1" stroke="#38bdf8" stroke-width="1" />
                <text x="28" y="58" font-size="8" font-weight="bold" fill="#ffffff">NO</text>
                <text x="28" y="82" font-size="8" font-weight="bold" fill="#ffffff">NC</text>
                <text x="155" y="70" font-size="8" font-weight="bold" fill="#fde047" text-anchor="end">COM</text>
                <circle cx="52" cy="55" r="2.5" fill="#ffffff" />
                <circle cx="52" cy="79" r="2.5" fill="#ffffff" />
                <circle cx="128" cy="67" r="2.5" fill="#fde047" />
                <line id="r1-armature" x1="128" y1="67" x2="52" y2="79" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
              </g>

              <!-- Output Terminals -->
              <g transform="translate(410, 36)">
                <rect x="0" y="0" width="34" height="104" rx="3" fill="#16a34a" stroke="#15803d" stroke-width="2" />
                <text x="-6" y="22" font-size="8.5" font-weight="bold" fill="#86efac" text-anchor="end">NO</text>
                <text x="-6" y="54" font-size="8.5" font-weight="bold" fill="#fde047" text-anchor="end">COM</text>
                <text x="-6" y="86" font-size="8.5" font-weight="bold" fill="#cbd5e1" text-anchor="end">NC</text>
              </g>
            </g>

            <!-- =========================================================================
                 5. RELAY #2: 2-Channel 5V Active HIGH (250V/10A)
                 ========================================================================= -->
            <g id="relay-mod-2" transform="translate(416, 218)" filter="url(#dropShadow)">
              <rect x="0" y="0" width="456" height="176" rx="8" fill="#1e293b" stroke="#2563eb" stroke-width="2.2" />
              <rect x="0" y="0" width="456" height="24" rx="8" fill="#1d4ed8" />
              <rect x="0" y="14" width="456" height="10" fill="#1d4ed8" />
              <text x="228" y="16" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
                Relay 2-Ch 5V • 250V/10A (Active HIGH)
              </text>

              <!-- Control Pins -->
              <rect x="12" y="38" width="24" height="114" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
              <text x="42" y="54" font-size="8.5" font-weight="bold" fill="#f87171">VCC</text>
              <text x="42" y="80" font-size="8.5" font-weight="bold" fill="#94a3b8">GND</text>
              <text x="42" y="106" font-size="8.5" font-weight="bold" fill="#facc15">IN1</text>
              <text x="42" y="132" font-size="8.5" font-weight="bold" fill="#c084fc">IN2</text>

              <!-- Relay Status Box -->
              <g transform="translate(115, 38)">
                <rect x="0" y="0" width="225" height="114" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.8" />
                <text x="112" y="18" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">2-CHANNEL RELAY (10A / CH)</text>
                <text x="112" y="31" font-size="7.5" font-weight="bold" fill="#fef08a" text-anchor="middle">5V / 70mA per Ch</text>

                <circle id="r2-ch1-led" cx="24" cy="60" r="5" fill="#052e16" />
                <text id="r2-ch1-txt" x="36" y="63" font-size="8" font-weight="bold" fill="#93c5fd">CH1: OFF</text>

                <circle id="r2-ch2-led" cx="24" cy="88" r="5" fill="#052e16" />
                <text id="r2-ch2-txt" x="36" y="91" font-size="8" font-weight="bold" fill="#93c5fd">CH2: OFF</text>
              </g>

              <!-- Output Terminals -->
              <g transform="translate(410, 34)">
                <rect x="0" y="0" width="34" height="122" rx="3" fill="#16a34a" stroke="#15803d" stroke-width="2" />

        >// D7 -> Relay 1-Ch (Active HIGH) -> หลอดไฟ 12VAC (0.83A)
// D6 -> Relay 2-Ch CH1 (Active HIGH) -> พัดลม 12VAC (1.00A)
// D5 -> Relay 4-Ch Isolation IN1 (Active HIGH) -> LED 12VDC (0.50A)
// D4 -> Relay Shield IN1 (Active LOW: LOW=ON, HIGH=OFF) -> พัดลม 12VDC (0.50A)

int r1_LampAC = 7;
int r2_FanAC  = 6;
int r4_LedDC  = 5;
int rs_FanDC  = 4; // Active LOW Shield

void setup() {
  Serial.begin(9600);
  pinMode(r1_LampAC, OUTPUT);
  pinMode(r2_FanAC, OUTPUT);
  pinMode(r4_LedDC, OUTPUT);
  pinMode(rs_FanDC, OUTPUT);

  digitalWrite(r1_LampAC, LOW);
  digitalWrite(r2_FanAC, LOW);
  digitalWrite(r4_LedDC, LOW);
  digitalWrite(rs_FanDC, HIGH);

  display.clearDisplay();
  display.setCursor(0, 0);
  display.println("ALL 4 RELAYS READY");
  display.println("12VAC & 12VDC OK");
  display.display();
  Serial.println("System Ready");
}

void loop() {
  digitalWrite(r1_LampAC, HIGH);
  digitalWrite(r2_FanAC, HIGH);
  digitalWrite(r4_LedDC, LOW);
  digitalWrite(rs_FanDC, HIGH);
  display.clearDisplay();
  display.setCursor(0, 0);
  display.println("12VAC: ON (1.83A)");
  display.println("12VDC: OFF (0.00A)");
  display.display();
  Serial.println("12VAC Active (1.83A)");
  delay(2200);

  digitalWrite(r1_LampAC, LOW);
  digitalWrite(r2_FanAC, LOW);
  digitalWrite(r4_LedDC, HIGH);
  digitalWrite(rs_FanDC, LOW);
  display.clearDisplay();
  display.setCursor(0, 0);
  display.println("12VAC: OFF (0.00A)");
  display.println("12VDC: ON (1.00A)");
  display.display();
  Serial.println("12VDC Battery Active (1.00A)");
  delay(2200);

  digitalWrite(r1_LampAC, HIGH);
  digitalWrite(r2_FanAC, HIGH);
  digitalWrite(r4_LedDC, HIGH);
  digitalWrite(rs_FanDC, LOW);
  display.clearDisplay();
  display.setCursor(0, 0);
  display.println("ALL 4 LOADS: ON");
  display.println("AC:1.83A DC:1.00A");
  display.display();
  Serial.println("ALL 4 LOADS ACTIVE");
  delay(2500);
}</textarea>

      wires: [],
      selectedPinId: null,
      draftPoints: [],
      draggingWaypoint: null,
      currentWireColor: '#ef4444',
      acBreakerOn: false,
      dcBatteryOn: false,
      isRunning: false,
      runLoopTimer: null,
      pinModes: {},
      digitalStates: {},
      oledPowered: false,
      oledLines: ['OLED 0.96" I2C', 'AC: OFF | DC: OFF', 'READY'],
      prevAnyRelayOn: false,
      acLampOn: false,
      acFanOn: false,
      dcLedOn: false,
      dcFanOn: false
    };

    let audioCtx = null;
    function playRelayClick(energized) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(energized ? 1400 : 950, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.025);
        gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.028);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      } catch (e) {}
    }

    /**
     * ============================================================================
     * 3. RENDER PINS, WIRES, & WAYPOINTS
     * ============================================================================
     */
    const svgCanvas = document.getElementById('circuitCanvas');
    const pinsLayer = document.getElementById('pinsLayer');
    const wiresLayer = document.getElementById('wiresLayer');
    const waypointsLayer = document.getElementById('waypointsLayer');
    const previewWire = document.getElementById('previewWire');

    function getPinById(id) {
      return ALL_PINS.find(p => p.id === id);
    }

    function renderAllPins() {
      pinsLayer.innerHTML = '';
      ALL_PINS.forEach(pin => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'pin-node');
        g.setAttribute('data-pin-id', pin.id);

        if (pin.type === 'screw') {
          const outer = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          outer.setAttribute('cx', pin.x);
          outer.setAttribute('cy', pin.y);
          outer.setAttribute('r', '7.5');
          outer.setAttribute('fill', '#cbd5e1');
          outer.setAttribute('stroke', '#475569');
          outer.setAttribute('stroke-width', '1.6');

          const slot = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          slot.setAttribute('x1', pin.x - 4.5);
          slot.setAttribute('y1', pin.y - 2.5);
          slot.setAttribute('x2', pin.x + 4.5);
          slot.setAttribute('y2', pin.y + 2.5);
          slot.setAttribute('stroke', '#334155');
          slot.setAttribute('stroke-width', '1.8');

          g.appendChild(outer);
          g.appendChild(slot);
        } else {
          const hole = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          hole.setAttribute('cx', pin.x);
          hole.setAttribute('cy', pin.y);
          hole.setAttribute('r', '4.3');
          hole.setAttribute('fill', pin.color);
          hole.setAttribute('stroke', '#64748b');
          hole.setAttribute('stroke-width', '1.2');
          g.appendChild(hole);

          if (pin.component === 'Arduino' && pin.labelPos) {
            const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            lbl.setAttribute('x', pin.x);
            lbl.setAttribute('y', pin.labelPos === 'bottom' ? pin.y + 17 : pin.y - 11);
            lbl.setAttribute('font-size', '7');
            lbl.setAttribute('font-weight', 'bold');
            lbl.setAttribute('fill', '#ffffff');
            lbl.setAttribute('text-anchor', 'middle');
            lbl.textContent = pin.name;
            g.appendChild(lbl);
          }
        }

        const hit = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        hit.setAttribute('class', 'pin-hit');
        hit.setAttribute('cx', pin.x);
        hit.setAttribute('cy', pin.y);
        hit.setAttribute('r', '9');
        hit.setAttribute('fill', 'transparent');
        g.appendChild(hit);

        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = `${pin.component}: ${pin.name}`;
        g.appendChild(title);

        g.addEventListener('click', (e) => {
          e.stopPropagation();
          handlePinClick(pin.id);
        });

        pinsLayer.appendChild(g);
      });
    }

    function buildPolylineOrCurvePath(start, points = [], end) {
      const pts = [start, ...(points || []), end];
      if (pts.length === 2) {
        const [p1, p2] = pts;
        const dx = Math.abs(p2.x - p1.x);
        const dy = Math.abs(p2.y - p1.y);
        const sag = Math.min(60, Math.max(18, (dx + dy) * 0.14));
        const cx1 = p1.x;
        const cy1 = p1.y + (p1.y < 250 ? -sag * 0.4 : sag * 0.55);
        const cx2 = p2.x;
        const cy2 = p2.y + (p2.y < 250 ? -sag * 0.4 : sag * 0.55);
        return `M ${p1.x} ${p1.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${p2.x} ${p2.y}`;
      }

      let d = `M ${pts[0].x} ${pts[0].y}`;
      const cornerRadius = 7;
      for (let i = 1; i < pts.length - 1; i++) {
        const prev = pts[i - 1];
        const curr = pts[i];
        const next = pts[i + 1];

        const v1x = prev.x - curr.x;
        const v1y = prev.y - curr.y;
        const len1 = Math.hypot(v1x, v1y) || 1;

        const v2x = next.x - curr.x;
        const v2y = next.y - curr.y;
        const len2 = Math.hypot(v2x, v2y) || 1;

        const r = Math.min(cornerRadius, len1 * 0.4, len2 * 0.4);
        const pStartX = curr.x + (v1x / len1) * r;
        const pStartY = curr.y + (v1y / len1) * r;
        const pEndX = curr.x + (v2x / len2) * r;
        const pEndY = curr.y + (v2y / len2) * r;

        d += ` L ${pStartX.toFixed(1)} ${pStartY.toFixed(1)} Q ${curr.x} ${curr.y}, ${pEndX.toFixed(1)} ${pEndY.toFixed(1)}`;
      }
      const last = pts[pts.length - 1];
      d += ` L ${last.x} ${last.y}`;
      return d;
    }

    function handlePinClick(pinId) {
      if (!state.selectedPinId) {
        state.selectedPinId = pinId;
        state.draftPoints = [];
        updatePinSelectionVisuals();
        const p = getPinById(pinId);
        previewWire.setAttribute('stroke', state.currentWireColor);
        previewWire.setAttribute('d', `M ${p.x} ${p.y} L ${p.x} ${p.y}`);
        previewWire.setAttribute('opacity', '0.85');
      } else if (state.selectedPinId === pinId) {
        cancelWiring();
      } else {
        addWire(state.selectedPinId, pinId, state.currentWireColor, [...state.draftPoints]);
        cancelWiring();
      }
    }

    function cancelWiring() {
      state.selectedPinId = null;
      state.draftPoints = [];
      previewWire.setAttribute('opacity', '0');
      updatePinSelectionVisuals();
    }

    function updatePinSelectionVisuals() {
      document.querySelectorAll('.pin-node').forEach(node => {
        if (node.getAttribute('data-pin-id') === state.selectedPinId) {
          node.classList.add('pin-selected');
        } else {
          node.classList.remove('pin-selected');
        }
      });
    }

    function getSvgPoint(clientX, clientY) {
      const pt = svgCanvas.createSVGPoint();
      pt.x = clientX;
      pt.y = clientY;
      return pt.matrixTransform(svgCanvas.getScreenCTM().inverse());
    }

    svgCanvas.addEventListener('click', (e) => {
      if (state.draggingWaypoint) {
        state.draggingWaypoint = null;
        return;
      }
      if (!state.selectedPinId) return;
      const pt = getSvgPoint(e.clientX, e.clientY);
      state.draftPoints.push({ x: Math.round(pt.x), y: Math.round(pt.y) });
      const p1 = getPinById(state.selectedPinId);
      previewWire.setAttribute('d', buildPolylineOrCurvePath(p1, state.draftPoints, pt));
    });

    svgCanvas.addEventListener('contextmenu', (e) => {
      if (state.selectedPinId) {
        e.preventDefault();
        cancelWiring();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.selectedPinId) cancelWiring();
    });

    svgCanvas.addEventListener('mousemove', (e) => {
      const cursor = getSvgPoint(e.clientX, e.clientY);
      if (state.draggingWaypoint) {
        const wire = state.wires.find(w => w.id === state.draggingWaypoint.wireId);
        if (wire && wire.points[state.draggingWaypoint.pointIndex]) {
          wire.points[state.draggingWaypoint.pointIndex] = {
            x: Math.round(cursor.x),
            y: Math.round(cursor.y)
          };
          renderWires();
        }
        return;
      }
      if (!state.selectedPinId) return;
      const p1 = getPinById(state.selectedPinId);
      previewWire.setAttribute('d', buildPolylineOrCurvePath(p1, state.draftPoints, cursor));
    });

    window.addEventListener('mouseup', () => {
      state.draggingWaypoint = null;
    });

    function addWire(fromId, toId, color, points = []) {
      const exists = state.wires.some(
        w => (w.from === fromId && w.to === toId) || (w.from === toId && w.to === fromId)
      );
      if (exists) return;
      state.wires.push({
        id: 'wire_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        from: fromId,
        to: toId,
        color: color,
        points: points
      });
      renderWires();
      evaluateCircuitPhysics();
    }

    function removeWire(wireId) {
      state.wires = state.wires.filter(w => w.id !== wireId);
      renderWires();
      evaluateCircuitPhysics();
    }

    function renderWires() {
      wiresLayer.innerHTML = '';
      waypointsLayer.innerHTML = '';
      document.getElementById('wireCount').textContent = state.wires.length;

      state.wires.forEach(wire => {
        const p1 = getPinById(wire.from);
        const p2 = getPinById(wire.to);
        if (!p1 || !p2) return;

        const d = buildPolylineOrCurvePath(p1, wire.points || [], p2);
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', wire.color);
        path.setAttribute('stroke-width', '3.8');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        path.setAttribute('class', 'wire-path');
        path.setAttribute('data-wire-id', wire.id);

        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = `${p1.name} ⇄ ${p2.name}`;
        path.appendChild(title);

        path.addEventListener('click', (e) => {
          e.stopPropagation();
          removeWire(wire.id);
        });

        (wire.points || []).forEach((pt, idx) => {
          const handle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          handle.setAttribute('cx', pt.x);
          handle.setAttribute('cy', pt.y);
          handle.setAttribute('r', '4.2');
          handle.setAttribute('fill', '#ffffff');
          handle.setAttribute('stroke', wire.color);
          handle.setAttribute('stroke-width', '2');
          handle.setAttribute('class', 'waypoint-handle');

          handle.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            state.draggingWaypoint = { wireId: wire.id, pointIndex: idx };
          });
          handle.addEventListener('click', (e) => e.stopPropagation());
          handle.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            wire.points.splice(idx, 1);
            renderWires();
          });

          waypointsLayer.appendChild(handle);
        });

        const cap1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        cap1.setAttribute('cx', p1.x);
        cap1.setAttribute('cy', p1.y);
        cap1.setAttribute('r', '3.5');
        cap1.setAttribute('fill', wire.color);
        cap1.setAttribute('stroke', '#ffffff');
        cap1.setAttribute('stroke-width', '1');
        cap1.setAttribute('pointer-events', 'none');

        const cap2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        cap2.setAttribute('cx', p2.x);
        cap2.setAttribute('cy', p2.y);
        cap2.setAttribute('r', '3.5');
        cap2.setAttribute('fill', wire.color);
        cap2.setAttribute('stroke', '#ffffff');
        cap2.setAttribute('stroke-width', '1');
        cap2.setAttribute('pointer-events', 'none');

        wiresLayer.appendChild(path);
        wiresLayer.appendChild(cap1);
        wiresLayer.appendChild(cap2);
      });

      applyWireFlowAnimations();
    }

    function applyWireFlowAnimations() {
      const anyAcActive = state.acLampOn || state.acFanOn;
      const anyDcActive = state.dcLedOn || state.dcFanOn;
      document.querySelectorAll('.wire-path').forEach(el => {
        const wId = el.getAttribute('data-wire-id');
        const w = state.wires.find(item => item.id === wId);
        if (!w) return;
        el.classList.remove('wire-energized-ac', 'wire-energized-dc');
        const pins = [w.from, w.to];
        const isAc = pins.some(p => p.startsWith('AC12') || p.startsWith('AC_LAMP') || p.startsWith('AC_FAN'));
        const isDc = pins.some(p => p.startsWith('DC12') || p.startsWith('DC_LED') || p.startsWith('DC_FAN'));
        if (anyAcActive && isAc) el.classList.add('wire-energized-ac');
        if (anyDcActive && isDc) el.classList.add('wire-energized-dc');
      });
    }

    /**
     * ============================================================================
     * 4. CIRCUIT GRAPH SOLVER
     * ============================================================================
     */
    function buildBaseAdjacency() {
      const adj = {};
      ALL_PINS.forEach(p => { adj[p.id] = new Set(); });
      state.wires.forEach(w => {
        if (adj[w.from] && adj[w.to]) {
          adj[w.from].add(w.to);
          adj[w.to].add(w.from);
        }
      });

      const bus5v = ['BUS_5V_1', 'BUS_5V_2', 'BUS_5V_3', 'BUS_5V_4', 'BUS_5V_5'];
      const busGnd = ['BUS_GND_1', 'BUS_GND_2', 'BUS_GND_3', 'BUS_GND_4', 'BUS_GND_5'];
      for (let i = 0; i < bus5v.length - 1; i++) {
        adj[bus5v[i]].add(bus5v[i + 1]);
        adj[bus5v[i + 1]].add(bus5v[i]);
        adj[busGnd[i]].add(busGnd[i + 1]);
        adj[busGnd[i + 1]].add(busGnd[i]);
      }
      return adj;
    }

    function areConnected(adj, startId, targetIds) {
      const targets = Array.isArray(targetIds) ? targetIds : [targetIds];
      const visited = new Set([startId]);
      const queue = [startId];
      while (queue.length > 0) {
        const curr = queue.shift();
        if (targets.includes(curr)) return curr;
        for (const next of (adj[curr] || [])) {
          if (!visited.has(next)) {
            visited.add(next);
            queue.push(next);
          }
        }
      }
      return null;
    }

    function checkChannelEnergized(baseAdj, vccOk, gndOk, inPinId, isActiveLow) {
      if (!state.isRunning || !vccOk || !gndOk) return false;
      const digitalPinIds = ['UNO_D2','UNO_D3','UNO_D4','UNO_D5','UNO_D6','UNO_D7','UNO_D8','UNO_D9','UNO_D10','UNO_D11','UNO_D12','UNO_D13'];
      const sigPinId = areConnected(baseAdj, inPinId, digitalPinIds);
      if (!sigPinId) return false;
      const pinNum = parseInt(sigPinId.replace('UNO_D', ''), 10);
      if (state.pinModes[pinNum] !== 'OUTPUT') return false;
      const val = state.digitalStates[pinNum] === 1 ? 'HIGH' : 'LOW';
      return isActiveLow ? (val === 'LOW') : (val === 'HIGH');
    }

    function evaluateCircuitPhysics() {
      const baseAdj = buildBaseAdjacency();
      const uno5vSources = ['UNO_5V'];
      const unoGndSources = ['UNO_GND1', 'UNO_GND2', 'UNO_GND_TOP'];

      // 1. OLED Display
      const oledVcc = !!areConnected(baseAdj, 'OLED_VCC', uno5vSources);
      const oledGnd = !!areConnected(baseAdj, 'OLED_GND', unoGndSources);
      state.oledPowered = oledVcc && oledGnd;
      updateOledVisual();

      // D13 LED on Arduino
      const d13High = state.isRunning && state.digitalStates[13] === 1;
      document.getElementById('uno-led-l').setAttribute('fill', d13High ? '#facc15' : '#713f12');

      // 2. Evaluate All 4 Relay Modules
      let activeCoilsCount = 0;
      let totalCoilCurrentMa = 0;

      // Relay #1: 1-Ch Active HIGH
      const r1Vcc = !!areConnected(baseAdj, 'R1_VCC', uno5vSources);
      const r1Gnd = !!areConnected(baseAdj, 'R1_GND', unoGndSources);
      const r1Pwr = r1Vcc && r1Gnd;
      document.getElementById('r1-led-pwr').setAttribute('fill', r1Pwr ? '#ef4444' : '#450a0a');
      const r1On = checkChannelEnergized(baseAdj, r1Vcc, r1Gnd, 'R1_IN1', false);
      document.getElementById('r1-led-act').setAttribute('fill', r1On ? '#22c55e' : '#052e16');
      document.getElementById('r1-armature').setAttribute('y2', r1On ? '55' : '79');
      if (r1On) { activeCoilsCount++; totalCoilCurrentMa += 70; }

      // Relay #2: 2-Ch Active HIGH
      const r2Vcc = !!areConnected(baseAdj, 'R2_VCC', uno5vSources);
      const r2Gnd = !!areConnected(baseAdj, 'R2_GND', unoGndSources);
      const r2Ch1On = checkChannelEnergized(baseAdj, r2Vcc, r2Gnd, 'R2_IN1', false);
      const r2Ch2On = checkChannelEnergized(baseAdj, r2Vcc, r2Gnd, 'R2_IN2', false);
      document.getElementById('r2-ch1
